[project]
name = "purchase-planner"
version = "0.1.0"
description = "A 30-day purchase plan per supplier from a demand forecast, stock and lead times"
requires-python = ">=3.11"
license = "MIT"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".cache", "data", "output"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["purchase_planner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
